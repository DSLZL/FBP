fbp-scan-radius=Scan Radius
fbp-allow-others=Allow Others
fbp-batch-mode=Batch Placement Mode
fbp-enable-for-me=Enable Blueprint Printer for Me
fbp-debug-mode=Debug Mode

[mod-setting-description]
fbp-speed=Number of ticks between print cycles. Lower is faster but may impact performance. (Default: 30)
fbp-scan-radius=The radius around the player to scan for ghosts and entities. Larger radius may impact performance. (Default: 100, Max: 500)
fbp-allow-others=Allow non-admin players to use the printer.
fbp-batch-mode=If enabled, places items in bursts. If disabled, places items continuously over time.
fbp-enable-for-me=Enable or disable the blueprint printer for yourself. Each player controls their own setting.
fbp-debug-mode=Enable verbose logging to console for troubleshooting.

